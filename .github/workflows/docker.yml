name: Build & Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Docker image ─────────────────────────────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── macOS .app + .dmg ────────────────────────────────────────────────────────
  build-mac-app:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-mac.txt

      - name: Build .app
        run: |
          pyinstaller app.py \
            --name "Campus Stage Displays" \
            --windowed \
            --noconfirm \
            --add-data "templates/index.html:templates" \
            --add-data "campuses.json:." \
            --hidden-import flask \
            --hidden-import jinja2 \
            --hidden-import werkzeug \
            --hidden-import click \
            --hidden-import itsdangerous \
            --hidden-import markupsafe \
            --osx-bundle-identifier "studio.7andco.stage-display"

      - name: Patch Info.plist (menu bar only, no Dock icon)
        run: |
          PLIST="dist/Campus Stage Displays.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true"       "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST"

      - name: Create .dmg
        run: |
          hdiutil create \
            -volname "Campus Stage Displays" \
            -srcfolder "dist/Campus Stage Displays.app" \
            -ov -format UDZO \
            "dist/CampusStageDisplays.dmg"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusStageDisplays-macOS
          path: dist/CampusStageDisplays.dmg
          retention-days: 30
