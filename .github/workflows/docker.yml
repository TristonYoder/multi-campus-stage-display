name: Build & Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Compute version (yyyy.mm.dd.N) ───────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Compute daily version
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y.%m.%d)
          COUNT=$(gh api repos/${{ github.repository }}/releases \
            --jq "[.[] | select(.tag_name | startswith(\"$DATE.\"))] | length" \
            2>/dev/null || echo "0")
          VERSION="$DATE.$((COUNT + 1))"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"

  # ── Docker image ─────────────────────────────────────────────────────────────
  build-docker:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── macOS .app + .dmg ────────────────────────────────────────────────────────
  build-mac-app:
    needs: version
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-mac.txt

      - name: Write VERSION file
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Build icon.icns from icon.png
        run: |
          mkdir -p icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size icon.png --out icon.iconset/icon_${size}x${size}.png
          done
          sips -z 32  32  icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 64  64  icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 256 256 icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 512 512 icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build .app
        run: |
          pyinstaller app.py \
            --name "Multi-Campus Stage Display" \
            --windowed \
            --noconfirm \
            --icon icon.icns \
            --add-data "templates/index.html:templates" \
            --add-data "campuses.json:." \
            --add-data "icon.png:." \
            --add-data "VERSION:." \
            --hidden-import flask \
            --hidden-import jinja2 \
            --hidden-import werkzeug \
            --hidden-import click \
            --hidden-import itsdangerous \
            --hidden-import markupsafe \
            --hidden-import certifi \
            --collect-data certifi \
            --osx-bundle-identifier "studio.7andco.stage-display"

      - name: Patch Info.plist (menu bar only, no Dock icon; set bundle icon)
        run: |
          PLIST="dist/Multi-Campus Stage Display.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true"                    "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :LSUIElement true"                         "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string icon"             "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile icon"                    "$PLIST"

      - name: Ad-hoc sign .app (suppresses "damaged" Gatekeeper warning)
        run: |
          codesign --force --deep --sign - \
            "dist/Multi-Campus Stage Display.app"

      - name: Create .dmg
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/dmg
          cp -r "dist/Multi-Campus Stage Display.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname "Multi-Campus Stage Display" \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            "dist/MultiCampusStageDisplay-${VERSION}.dmg"

      - name: Upload .dmg artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: MultiCampusStageDisplay-${{ needs.version.outputs.version }}-macOS
          path: dist/MultiCampusStageDisplay-${{ needs.version.outputs.version }}.dmg
          retention-days: 30

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            "dist/MultiCampusStageDisplay-${VERSION}.dmg" \
            --title "$VERSION" \
            --generate-notes
