name: Build & Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Docker image ─────────────────────────────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── macOS .app + .dmg ────────────────────────────────────────────────────────
  build-mac-app:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python (framework build via Homebrew)
        run: |
          brew install python@3.12
          echo "/opt/homebrew/opt/python@3.12/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip3.12 install setuptools -r requirements-mac.txt

      - name: Build .app
        run: python3.12 setup.py py2app

      - name: Create .dmg
        run: |
          hdiutil create \
            -volname "Campus Stage Displays" \
            -srcfolder "dist/Campus Stage Displays.app" \
            -ov -format UDZO \
            "dist/CampusStageDisplays.dmg"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusStageDisplays-macOS
          path: dist/CampusStageDisplays.dmg
          retention-days: 30
