name: Build & Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Docker image ─────────────────────────────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── macOS .app + .dmg ────────────────────────────────────────────────────────
  build-mac-app:
    runs-on: macos-latest
    permissions:
      contents: write  # needed to create GitHub releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-mac.txt

      - name: Build icon.icns from icon.png
        run: |
          mkdir -p icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size icon.png --out icon.iconset/icon_${size}x${size}.png
          done
          sips -z 32  32  icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 64  64  icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 256 256 icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 512 512 icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build .app
        run: |
          pyinstaller app.py \
            --name "Multi-Campus Stage Display" \
            --windowed \
            --noconfirm \
            --icon icon.icns \
            --add-data "templates/index.html:templates" \
            --add-data "campuses.json:." \
            --add-data "icon.png:." \
            --add-data "VERSION:." \
            --hidden-import flask \
            --hidden-import jinja2 \
            --hidden-import werkzeug \
            --hidden-import click \
            --hidden-import itsdangerous \
            --hidden-import markupsafe \
            --osx-bundle-identifier "studio.7andco.stage-display"

      - name: Patch Info.plist (menu bar only, no Dock icon)
        run: |
          PLIST="dist/Multi-Campus Stage Display.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :LSUIElement true"      "$PLIST"

      - name: Ad-hoc sign .app (suppresses "damaged" Gatekeeper warning)
        run: |
          codesign --force --deep --sign - \
            "dist/Multi-Campus Stage Display.app"

      - name: Create .dmg
        run: |
          hdiutil create \
            -volname "Multi-Campus Stage Display" \
            -srcfolder "dist/Multi-Campus Stage Display.app" \
            -ov -format UDZO \
            "dist/MultiCampusStageDisplay.dmg"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: MultiCampusStageDisplay-macOS
          path: dist/MultiCampusStageDisplay.dmg
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MultiCampusStageDisplay.dmg
          generate_release_notes: true
